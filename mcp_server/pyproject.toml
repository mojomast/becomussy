[project]
name = "becomussy-mcp"
version = "0.1.0"
description = "MCP server for becomussy - governed continuity system for agent self-development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
becomussy-mcp = "becomussy_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
